name: Publicar en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://wleqwxqqzckkazzbunxf.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_Lul8kIe1yNtvFGoH5auHZQ_782RcJn6
      VITE_WHATSAPP: "56930624514"
      VITE_CHECKOUT_CAMPANA: ${{ vars.CHECKOUT_CAMPANA }}
      VITE_CHECKOUT_PRO: ${{ vars.CHECKOUT_PRO }}
      # Sin dominio propio la app vive en /acopia/; con acopia.app apuntando a Pages, cambiar a "/"
      BASE: ${{ vars.BASE || '/encajados/' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: bash scripts/empaquetar.sh
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
